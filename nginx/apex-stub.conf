# Apex name only. This vhost is not the forum archive.
# deploy_apex.sh substitutes example.org and /var/www/apex-stub.
# Certbot adds the TLS listener for this server_name.

server {
    listen 80;
    listen [::]:80;
    server_name example.org;

    root /var/www/apex-stub;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
