# Example: live modern forum + this static archive on one VDS
#
# Recommended layout (subdomains) — keeps OE relative links working:
#   https://forum.example.com/     → XenForo / Discourse / Flarum / SMF 2.1 …
#   https://history.example.com/   → this archive (document root = cleaned site)
#
# DNS: A/AAAA for both names → same VDS IP.
# TLS: certbot --nginx -d forum.example.com -d history.example.com

# --- modern forum (placeholder; replace with your app’s snippet) ---
server {
    listen 80;
    listen [::]:80;
    server_name forum.example.com;

    # root /var/www/forum/public;          # XenForo / Flarum example
    # # or proxy to Discourse / docker:
    # location / {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        return 200 'Replace this server{} with your live forum vhost.\n';
        add_header Content-Type text/plain;
    }
}

# --- Dark Side 2014 static archive ---
server {
    listen 80;
    listen [::]:80;
    server_name history.example.com;

    root /var/www/ds-forum-archive;
    index index.html default.htm;

    charset windows-1251;
    charset_types text/css application/javascript text/plain application/xml;
    absolute_redirect off;

    # See nginx/archive.conf. Root-relative; host follows the request DNS name.
    set $archive_index /;

    sub_filter_once off;
    sub_filter '<div id="header"><div class="frame">' '<div id="header"><div class="frame"><div id="archive-banner" style="text-align:center;font-size:28px;line-height:1.35;font-weight:700;color:#5c1010;background:#fff4cc;border:2px solid #c9a227;padding:16px 20px;margin:8px 0 14px;">&#1040;&#1088;&#1093;&#1080;&#1074;&#1085;&#1072;&#1103; &#1082;&#1086;&#1087;&#1080;&#1103;. &#1058;&#1086;&#1083;&#1100;&#1082;&#1086; &#1076;&#1083;&#1103; &#1087;&#1088;&#1086;&#1089;&#1084;&#1086;&#1090;&#1088;&#1072;.</div>';
    sub_filter 'href="index.php"' 'href="$archive_index"';
    sub_filter '</head>' '<link rel="stylesheet" type="text/css" href="/archive-fixes.css"></head>';

    location = /archive-fixes.css {
        alias /etc/nginx/ds-forum-archive-fixes.css;
        default_type text/css;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location ~ '^/ds-alliance\.ru/forum/index\.php@(action=(pm|login2?|logout|post|admin|markasread|emailuser|collapse|profile;area=account)(;|$|@)|wap2?($|;)|nowap($|;))' {
        default_type text/html;
        charset utf-8;
        root /etc/nginx;
        sub_filter_once off;
        sub_filter '__ARCHIVE_INDEX__' '$archive_index';
        try_files /ds-forum-action-stub.html =404;
    }

    location ~ ^/ds-alliance\.ru/forum/index\.php {
        default_type text/html;
        charset windows-1251;
        try_files $uri =404;
    }

    location ~ ^/ds-alliance\.ru/forum/@ {
        default_type text/html;
        charset windows-1251;
        try_files $uri =404;
    }

    location = / {
        default_type text/html;
        charset windows-1251;
        sub_filter_once off;
        sub_filter '<head>' '<head><base href="/ds-alliance.ru/forum/">';
        sub_filter '<div id="header"><div class="frame">' '<div id="header"><div class="frame"><div id="archive-banner" style="text-align:center;font-size:28px;line-height:1.35;font-weight:700;color:#5c1010;background:#fff4cc;border:2px solid #c9a227;padding:16px 20px;margin:8px 0 14px;">&#1040;&#1088;&#1093;&#1080;&#1074;&#1085;&#1072;&#1103; &#1082;&#1086;&#1087;&#1080;&#1103;. &#1058;&#1086;&#1083;&#1100;&#1082;&#1086; &#1076;&#1083;&#1103; &#1087;&#1088;&#1086;&#1089;&#1084;&#1086;&#1090;&#1088;&#1072;.</div>';
        sub_filter 'href="index.php"' 'href="$archive_index"';
        sub_filter '</head>' '<link rel="stylesheet" type="text/css" href="/archive-fixes.css"></head>';
        try_files /ds-alliance.ru/forum/default.htm =404;
    }

    location = /ds-alliance.ru/forum/default.htm {
        return 302 $archive_index;
    }

    location = /ds-alliance.ru/forum/ {
        return 302 $archive_index;
    }

    location = /ds-alliance.ru/forum {
        return 302 $archive_index;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~ /\. { deny all; }

    location ~* \.(gif|jpe?g|png|webp|css|js|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    access_log /var/log/nginx/ds-history.access.log;
    error_log  /var/log/nginx/ds-history.error.log;
}
