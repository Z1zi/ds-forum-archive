# Dark Side forum static archive — nginx site
# Document root must be the cleaned site (contains ds-alliance.ru/, index.html, …).

server {
    listen 80;
    listen [::]:80;
    server_name archive.example.com;

    # Uncomment after certificates exist:
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/ssl/certs/archive.example.com.pem;
    # ssl_certificate_key /etc/ssl/private/archive.example.com.key;

    root /var/www/ds-forum-archive;
    index index.html default.htm archive-index.html;

    charset windows-1251;
    charset_types text/css application/javascript text/plain application/xml;

    # OE saved pages as files with '@', ';', '=' in names
    absolute_redirect off;

    # Where "go to the archive index" links point.
    # Root-relative path, no hostname: the browser keeps the DNS name
    # that was used to open the page. Do not put https://example.com here.
    # Bare href="index.php" only (title DarkSide., Home, breadcrumbs,
    # rel=canonical, rel=contents). index.php@topic=… / @board=… stay.
    # Keep this equal to the URI served by location = / below.
    set $archive_index /;

    # Visible on every SMF page. Numeric entities survive windows-1251 pages.
    sub_filter_once off;
    sub_filter '<div id="header"><div class="frame">' '<div id="header"><div class="frame"><div id="archive-banner" style="text-align:center;font-size:28px;line-height:1.35;font-weight:700;color:#5c1010;background:#fff4cc;border:2px solid #c9a227;padding:16px 20px;margin:8px 0 14px;">&#1040;&#1088;&#1093;&#1080;&#1074;&#1085;&#1072;&#1103; &#1082;&#1086;&#1087;&#1080;&#1103;. &#1058;&#1086;&#1083;&#1100;&#1082;&#1086; &#1076;&#1083;&#1103; &#1087;&#1088;&#1086;&#1089;&#1084;&#1086;&#1090;&#1088;&#1072;.</div>';
    sub_filter 'href="index.php"' 'href="$archive_index"';
    sub_filter '</head>' '<link rel="stylesheet" type="text/css" href="/archive-fixes.css"></head>';

    location = /archive-fixes.css {
        alias /etc/nginx/ds-forum-archive-fixes.css;
        default_type text/css;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    # Interactive SMF actions are not in the mirror (pm, login, post, …).
    # Stub redirects to $archive_index. Must be above the general index.php location.
    location ~ '^/ds-alliance\.ru/forum/index\.php@(action=(pm|login2?|logout|post|admin|markasread|emailuser|collapse|profile;area=account)(;|$|@)|wap2?($|;)|nowap($|;))' {
        default_type text/html;
        charset utf-8;
        root /etc/nginx;
        sub_filter_once off;
        sub_filter '__ARCHIVE_INDEX__' '$archive_index';
        try_files /ds-forum-action-stub.html =404;
    }

    # SMF pages have no .html suffix (index.php@topic=10.0) — force HTML
    location ~ ^/ds-alliance\.ru/forum/index\.php {
        default_type text/html;
        charset windows-1251;
        try_files $uri =404;
    }

    location ~ ^/ds-alliance\.ru/forum/@ {
        default_type text/html;
        charset windows-1251;
        try_files $uri =404;
    }

    # Domain root shows the forum index. <base> keeps OE relative links working.
    location = / {
        default_type text/html;
        charset windows-1251;
        sub_filter_once off;
        sub_filter '<head>' '<head><base href="/ds-alliance.ru/forum/">';
        sub_filter '<div id="header"><div class="frame">' '<div id="header"><div class="frame"><div id="archive-banner" style="text-align:center;font-size:28px;line-height:1.35;font-weight:700;color:#5c1010;background:#fff4cc;border:2px solid #c9a227;padding:16px 20px;margin:8px 0 14px;">&#1040;&#1088;&#1093;&#1080;&#1074;&#1085;&#1072;&#1103; &#1082;&#1086;&#1087;&#1080;&#1103;. &#1058;&#1086;&#1083;&#1100;&#1082;&#1086; &#1076;&#1083;&#1103; &#1087;&#1088;&#1086;&#1089;&#1084;&#1086;&#1090;&#1088;&#1072;.</div>';
        sub_filter 'href="index.php"' 'href="$archive_index"';
        sub_filter '</head>' '<link rel="stylesheet" type="text/css" href="/archive-fixes.css"></head>';
        try_files /ds-alliance.ru/forum/default.htm =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /ds-alliance.ru/forum/default.htm {
        return 302 $archive_index;
    }

    location = /ds-alliance.ru/forum/ {
        return 302 $archive_index;
    }

    location = /ds-alliance.ru/forum {
        return 302 $archive_index;
    }

    # Do not allow path traversal tricks
    location ~ /\. {
        deny all;
    }

    # Sensible caching for immutable archive assets
    location ~* \.(gif|jpe?g|png|webp|css|js|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Archive is read-only — block methods that imply interaction
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Optional access log
    access_log /var/log/nginx/ds-forum-archive.access.log;
    error_log  /var/log/nginx/ds-forum-archive.error.log;
}
