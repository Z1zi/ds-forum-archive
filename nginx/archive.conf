# Dark Side forum static archive — nginx site
# Document root must be the cleaned site (contains ds-alliance.ru/, index.html, …).

server {
    listen 80;
    listen [::]:80;
    server_name archive.example.com;

    # Uncomment after certificates exist:
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/ssl/certs/archive.example.com.pem;
    # ssl_certificate_key /etc/ssl/private/archive.example.com.key;

    root /var/www/ds-forum-archive;
    index index.html default.htm archive-index.html;

    charset windows-1251;
    charset_types text/css application/javascript text/plain application/xml;

    # OE saved pages as files with '@', ';', '=' in names
    absolute_redirect off;

    # SMF pages have no .html suffix (index.php@topic=10.0) — force HTML
    location ~ ^/ds-alliance\.ru/forum/index\.php {
        default_type text/html;
        charset windows-1251;
        try_files $uri =404;
    }

    location ~ ^/ds-alliance\.ru/forum/@ {
        default_type text/html;
        charset windows-1251;
        try_files $uri =404;
    }

    location = / {
        return 302 /ds-alliance.ru/forum/default.htm;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Forum entry (OE saved board index as default.htm)
    location = /ds-alliance.ru/forum/ {
        return 302 /ds-alliance.ru/forum/default.htm;
    }

    location = /ds-alliance.ru/forum {
        return 302 /ds-alliance.ru/forum/default.htm;
    }

    # Do not allow path traversal tricks
    location ~ /\. {
        deny all;
    }

    # Sensible caching for immutable archive assets
    location ~* \.(gif|jpe?g|png|webp|css|js|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Archive is read-only — block methods that imply interaction
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Optional access log
    access_log /var/log/nginx/ds-forum-archive.access.log;
    error_log  /var/log/nginx/ds-forum-archive.error.log;
}
